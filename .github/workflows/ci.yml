name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  lint-typecheck-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 버전을 여기 적지 않는다. 루트 package.json의 packageManager
      # ("pnpm@10.15.0")를 액션이 읽어 쓴다. 둘 다 지정하면
      # "Multiple versions of pnpm specified"로 설치 단계에서 죽는다.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # React 사본이 두 개면 모바일 앱이 화면을 못 그린다(ADR-0007). 타입체크·빌드는
      # 둘 다 통과시키고 런타임에만 터지는 회귀라 별도 검사가 필요하다.
      - name: React 단일 사본 검사
        run: node scripts/check-single-react.mjs

      # 위젯 딥링크(ongod://)는 서로 import할 수 없는 네 곳에 나뉘어 있다 — app.json scheme,
      # @ongod/core 상수, iOS 위젯 리터럴, Android 전달 경로. 어긋나도 타입체크·테스트는
      # 통과하고, 사용자가 위젯을 눌렀을 때 "아무 일도 안 일어남"으로만 드러난다(P3-S4-T3).
      - name: 위젯 딥링크 일치 검사
        run: node scripts/check-deep-link.mjs

      - run: pnpm lint

      - run: pnpm typecheck

      - run: pnpm test

      # build를 typecheck와 같은 스텝에서 동시에 돌리면 next build가 .next/types를
      # 지웠다 다시 만드는 동안 admin typecheck가 TS6053으로 깨진다. 스텝을 나눠
      # 순차 실행하는 것으로 그 레이스를 피한다.
      #
      # env는 전부 **가짜 플레이스홀더**다. 진짜 시크릿이 아니고, 그럴 필요도 없다.
      # 이 스텝의 목적은 "빌드가 끝까지 통과하는가"를 보는 것이지 실제 Supabase에
      # 붙는 게 아니다(ADR-0006이 고쳤던 next build 깨짐 같은 회귀를 잡는 용도).
      # admin은 페이지 데이터 수집 단계에서 env 스키마(zod)를 검증하므로, 형식만
      # 맞는 값이 없으면 빌드 자체가 진행되지 않는다.
      # 실제 배포 빌드는 Vercel이 진짜 값으로 수행한다(P0-S6-T4).
      - run: pnpm build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder-anon-key
          SUPABASE_SERVICE_ROLE_KEY: ci-placeholder-service-role-key
          ADMIN_EMAILS: ci@example.com
