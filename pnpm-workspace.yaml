packages:
  - "apps/*"
  - "packages/*"

onlyBuiltDependencies:
  - esbuild
  - sharp

# 저장소 전체가 React 인스턴스 하나만 쓰도록 강제한다.
#
# 배경: 이 저장소는 mobile(Expo)과 admin(Next)이 각각 react를 선언한다. 버전 범위가 조금만
# 달라도(예: mobile "19.2.3" vs admin "^19.0.0" → 19.2.8) pnpm이 물리적으로 다른 사본을 두
# 개 만들고, 그 둘이 한 번들에 섞이면 앱이 화면을 아예 못 그린다
# ("Objects are not valid as a React child"). 메이저가 같아도 인스턴스가 다르면 똑같이 깨진다.
#
# ADR-0006/0007은 이걸 "루트에 호이스팅될 버전을 못 박는" 방식으로 막았는데, 관리할 곳이
# 다섯 군데로 늘고 한 곳만 빠뜨려도 재발했다. React 메이저가 하나로 통일된 지금은 override로
# 한 곳에서 끝낼 수 있다. 근거: ADR-0008.
#
# 버전을 올릴 땐 여기만 고치면 된다. Expo SDK가 요구하는 React 버전에 맞춘다
# (SDK 57 = 19.2.3). 회귀는 scripts/check-single-react.mjs가 CI에서 잡는다.
overrides:
  react: 19.2.3
  react-dom: 19.2.3
  "@types/react": 19.2.18
  "@types/react-dom": 19.2.7
